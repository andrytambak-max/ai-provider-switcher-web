<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Provider Switcher</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="container topbar-inner">
          <div class="brand-wrap">
            <div class="brand-icon">🤖</div>
            <div>
              <div class="brand-name">AI Provider Switcher</div>
              <div class="brand-subtitle">Web dashboard</div>
            </div>
          </div>

          <button id="testProviderBtn" class="btn btn-warning">Test selected provider</button>
        </div>
      </header>

      <main class="container main-content">
        <section class="panel">
          <div class="panel-header">
            <h2>Available providers</h2>
            <span id="statusBadge" class="status-badge">Ready</span>
          </div>
          <div id="providerGrid" class="provider-grid"></div>
        </section>

        <section class="two-column">
          <div class="panel">
            <h3>Provider configuration</h3>
            <form id="providerForm" class="stacked-form">
              <label>
                Provider
                <select id="providerSelect"></select>
              </label>
              <label>
                Model
                <input id="providerModel" type="text" placeholder="gpt-4o-mini" />
              </label>
              <label>
                API key
                <input id="providerApiKey" type="password" placeholder="Paste your API key" />
              </label>
              <div class="form-actions">
                <button type="submit" class="btn btn-primary">Save config</button>
              </div>
            </form>
          </div>

          <div class="panel active-provider-panel">
            <h3>Current provider</h3>
            <div class="current-provider-card">
              <div id="currentProviderIcon" class="provider-large-icon">⚙️</div>
              <div>
                <div id="currentProviderName" class="current-provider-name">Gemini</div>
                <div id="currentProviderModel" class="current-provider-meta">gemini-2.0-flash</div>
              </div>
            </div>
            <div class="detail-list">
              <div class="detail-row">
                <span>Provider</span>
                <strong id="currentProviderLabel">Gemini</strong>
              </div>
              <div class="detail-row">
                <span>Model</span>
                <strong id="currentModelText">gemini-2.0-flash</strong>
              </div>
              <div class="detail-row">
                <span>API key</span>
                <strong id="currentKeyState">Not set</strong>
              </div>
            </div>
          </div>
        </section>

        <section class="panel chat-panel">
          <h3>Ask the selected AI</h3>
          <textarea id="promptInput" rows="8" placeholder="Type your prompt here...">Write a short product description for an AI provider dashboard.</textarea>

          <div class="chat-settings">
            <label>
              Temperature
              <input id="temperatureInput" type="range" min="0" max="1" step="0.1" value="0.7" />
              <span id="temperatureValue">0.7</span>
            </label>

            <label>
              Max tokens
              <input id="maxTokensInput" type="number" min="64" max="2048" step="32" value="512" />
            </label>
          </div>

          <div class="form-actions">
            <button id="generateBtn" class="btn btn-primary">Generate</button>
            <button id="clearBtn" type="button" class="btn btn-secondary">Clear</button>
          </div>
        </section>

        <section class="panel response-panel">
          <h3>Response</h3>
          <pre id="responseOutput" class="response-output">No response yet.</pre>
        </section>

        <section class="panel history-panel">
          <h3>Recent history</h3>
          <ul id="historyList" class="history-list"></ul>
        </section>
      </main>
    </div>

    <div id="toast" class="toast"></div>

    <script src="app.js"></script>
  </body>
</html>
